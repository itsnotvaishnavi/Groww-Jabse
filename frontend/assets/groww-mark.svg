<!--
  Groww's mark, traced from the official logo supplied by the repository owner.
  Used as hackathon attribution ("built for Groww Code"), not as this app's own
  identity. Trademark remains Groww's.

  Construction: the disc is filled indigo, then the spring-green region is the
  area below a market-chart polyline, clipped to the disc. Keeping it as two
  filled regions rather than a stroked line means it stays crisp at 20px in the
  nav and at any size in a README.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Groww">
  <defs>
    <clipPath id="growwDisc">
      <circle cx="24" cy="24" r="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#growwDisc)">
    <!-- Upper region. -->
    <rect x="0" y="0" width="48" height="48" fill="#4F63FF" />

    <!--
      Lower region: the chart line, with both ends run past the disc edge so the
      clip - not the geometry - decides where the shape stops.
      Line vertices: (1.5, 35.7) peak (18.2, 23.4) valley (28.1, 28.7) (46.8, 13.2)
    -->
    <path
      d="M -3 38.9 L 18.2 23.4 L 28.1 28.7 L 51 10.2 L 51 51 L -3 51 Z"
      fill="#00E5A8"
    />
  </g>
</svg>
