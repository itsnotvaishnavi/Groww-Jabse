<!--
  Groww's mark, used as hackathon attribution ("built for Groww Code") rather
  than as this app's own identity.

  This is a hand-drawn approximation, not the official asset - I did not have
  the real file to hand. To use the genuine mark, replace this one file with
  Groww's official SVG and keep the name; nothing in the markup or CSS needs to
  change. Trademark remains Groww's.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Groww">
  <defs>
    <linearGradient id="growwGradient" x1="6" y1="42" x2="42" y2="6"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D09C" />
      <stop offset="0.55" stop-color="#12BBB4" />
      <stop offset="1" stop-color="#3A8FDE" />
    </linearGradient>
  </defs>

  <circle cx="24" cy="24" r="24" fill="url(#growwGradient)" />

  <!-- The rising curve, sweeping up to the right. -->
  <path d="M11 31.5c4.2 0 7.4-2.1 10.2-5.6 3-3.8 6.3-8.9 12.4-11.2"
        fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" />
  <path d="M28.8 13.2h6.6v6.6" fill="none" stroke="#fff" stroke-width="4.2"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
